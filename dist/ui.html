<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Design IR</title>
    <style>
      :root {
  color-scheme: light dark;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  font-size: 12px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--figma-color-bg);
  color: var(--figma-color-text);
}

main {
  display: grid;
  gap: 12px;
  padding: 16px;
}

header,
h1,
h2,
p,
dl,
dd,
fieldset {
  margin: 0;
}

.eyebrow {
  color: var(--figma-color-text-secondary);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1 {
  margin-top: 3px;
  font-size: 18px;
  line-height: 1.2;
}

h2,
legend,
.field > span {
  font-size: 11px;
  font-weight: 600;
}

.notice {
  margin-top: 4px;
  color: var(--figma-color-text-secondary);
  line-height: 1.35;
}

.document-card,
.progress-panel {
  padding: 10px;
  border: 1px solid var(--figma-color-border);
  border-radius: 6px;
}

dl {
  display: grid;
  gap: 5px;
  margin-top: 7px;
}

dl > div {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 8px;
}

dt,
.secondary,
small {
  color: var(--figma-color-text-secondary);
}

dd {
  overflow: hidden;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

form {
  display: grid;
  gap: 10px;
}

fieldset {
  display: grid;
  gap: 6px;
  padding: 8px 10px 10px;
  border: 1px solid var(--figma-color-border);
  border-radius: 6px;
}

legend {
  padding: 0 3px;
}

.choice,
.confirmation {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.3;
}

.choice input,
.confirmation input {
  flex: 0 0 auto;
  margin: 2px 0 0;
}

.choice span {
  display: grid;
  gap: 1px;
}

.choice.disabled {
  opacity: 0.55;
}

.field {
  display: grid;
  gap: 4px;
}

input[type="text"] {
  width: 100%;
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--figma-color-border);
  border-radius: 4px;
  background: var(--figma-color-bg);
  color: var(--figma-color-text);
  font: inherit;
}

input[type="text"]:focus {
  border-color: var(--figma-color-border-selected);
  outline: 1px solid var(--figma-color-border-selected);
}

.validation {
  color: var(--figma-color-text-danger);
  line-height: 1.35;
}

.actions {
  display: flex;
  gap: 8px;
}

button {
  min-height: 30px;
  padding: 0 12px;
  border: 1px solid var(--figma-color-border);
  border-radius: 5px;
  background: var(--figma-color-bg-secondary);
  color: var(--figma-color-text);
  font: inherit;
  font-weight: 600;
}

button.primary {
  flex: 1;
  border-color: transparent;
  background: var(--figma-color-bg-brand);
  color: var(--figma-color-text-onbrand);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.progress-panel {
  display: grid;
  gap: 6px;
}

.progress-heading {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

progress {
  width: 100%;
  height: 6px;
}

.status-panel {
  --status-color: var(--figma-color-text-brand, #0d99ff);

  display: grid;
  gap: 7px;
  padding: 9px 10px;
  border: 1px solid var(--figma-color-border);
  border-left: 3px solid var(--status-color);
  border-radius: 6px;
  background: var(--figma-color-bg-secondary);
}

.status-panel[data-state="ready"],
.status-panel[data-state="complete"] {
  --status-color: var(--figma-color-text-success, #14ae5c);
}

.status-panel[data-state="warning"] {
  --status-color: var(--figma-color-text-warning, #b86200);
}

.status-panel[data-state="cancelled"] {
  --status-color: var(--figma-color-text-secondary, #808080);
}

.status-panel[data-state="error"] {
  --status-color: var(--figma-color-text-danger, #f24822);
}

.status-heading,
.runtime-status {
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-heading {
  flex-wrap: wrap;
  justify-content: space-between;
}

.runtime-status {
  flex-wrap: wrap;
  justify-content: flex-end;
  min-width: 0;
}

.status-badge,
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 20px;
  padding: 2px 7px;
  border: 1px solid currentColor;
  border-radius: 999px;
  background: var(--figma-color-bg);
  font-size: 9px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
}

.status-badge {
  color: var(--status-color);
}

.status-badge::before,
.status-pill::before {
  width: 5px;
  height: 5px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: currentColor;
  content: "";
}

.status-pill[data-state="connecting"] {
  color: var(--figma-color-text-brand, #0d99ff);
}

.status-pill[data-state="connected"] {
  color: var(--figma-color-text-success, #14ae5c);
}

.status-pill[data-state="offline"] {
  color: var(--figma-color-text-secondary, #808080);
}

.status-message {
  color: var(--figma-color-text);
  line-height: 1.35;
}

[hidden] {
  display: none !important;
}

    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Local archive exporter</p>
        <h1>Figma Design IR</h1>
        <p class="notice">Runs locally. Network access is disabled.</p>
      </header>

      <section class="document-card" aria-labelledby="document-heading">
        <h2 id="document-heading">Open document</h2>
        <dl>
          <div>
            <dt>Name</dt>
            <dd id="document-name">Loading…</dd>
          </div>
          <div>
            <dt>Pages</dt>
            <dd id="page-count">—</dd>
          </div>
          <div>
            <dt>Selected layers</dt>
            <dd id="selection-count">—</dd>
          </div>
        </dl>
      </section>

      <form id="export-form" novalidate>
        <fieldset>
          <legend>Scope</legend>
          <label class="choice">
            <input
              id="scope-selection"
              type="radio"
              name="scope"
              value="current-selection"
              checked
            />
            <span>
              <strong>Current selection</strong>
              <small
                >Exports selected roots in deterministic canvas order.</small
              >
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="scope" value="entire-file" />
            <span>
              <strong>Entire file</strong>
              <small>Exports every page sequentially in document order.</small>
            </span>
          </label>
        </fieldset>

        <fieldset>
          <legend>Component scope (current selection)</legend>
          <label class="choice">
            <input
              id="component-scope-used"
              type="radio"
              name="componentScope"
              value="used"
              checked
            />
            <span>
              <strong>Used components</strong>
              <small
                >Compact archive: only components instantiated by the selection,
                with assets from the selection.</small
              >
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="componentScope" value="reachable" />
            <span>
              <strong>All reachable components</strong>
              <small
                >Full design-system coverage: every variant of each touched
                component set, with definition and style assets.</small
              >
            </span>
          </label>
        </fieldset>

        <label class="field" for="snapshot-id">
          <span>Snapshot ID</span>
          <input
            id="snapshot-id"
            name="snapshotId"
            type="text"
            maxlength="96"
            pattern="[a-z0-9][a-z0-9._-]{0,95}"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="snapshot-hint"
          />
          <small id="snapshot-hint"
            >Lowercase letters, numbers, dots, dashes, and underscores.</small
          >
        </label>

        <label class="confirmation">
          <input id="owner-confirmation" type="checkbox" />
          <span
            >I confirm this source copy is current and I am authorized to export
            it.</span
          >
        </label>

        <p id="validation-message" class="validation" role="alert" hidden></p>

        <div class="actions">
          <button id="export-button" class="primary" type="submit" disabled>
            Export AI archive
          </button>
          <button id="cancel-button" type="button" hidden>Cancel</button>
        </div>
      </form>

      <section
        id="progress-panel"
        class="progress-panel"
        aria-live="polite"
        hidden
      >
        <div class="progress-heading">
          <strong id="progress-title">Preparing export…</strong>
          <span id="progress-count"></span>
        </div>
        <progress id="progress-bar" max="1"></progress>
        <p id="progress-item" class="secondary"></p>
        <p id="archive-stats" class="secondary"></p>
        <p id="diagnostic-summary" class="secondary"></p>
      </section>

      <section
        id="status-panel"
        class="status-panel"
        data-state="connecting"
        aria-label="Plugin status"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="status-heading">
          <span id="status-badge" class="status-badge">Starting</span>
          <div class="runtime-status" aria-label="Runtime safeguards">
            <span
              id="connection-status"
              class="status-pill"
              data-state="connecting"
              >Connecting</span
            >
            <span class="status-pill" data-state="offline"
              >Network disabled</span
            >
          </div>
        </div>
        <p id="result-message" class="status-message">
          Loading document details…
        </p>
      </section>
    </main>

    <script>
